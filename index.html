<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONYX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --green: #00e87a; --amber: #ffbb00; --red: #ff3366; --blue: #55aaff; --golf: #a8e063; --nfl: #d4a017; }
html, html { height: 100%; }
body { background: #0a0a0a; color: #fff; font-family: 'Nunito', sans-serif; height: 100%; overflow: hidden; }

/* SPORT SELECTOR */
#sport-selector { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;  overflow-y: auto; padding: 40px 20px; }
#sport-selector.hidden { display: none; }
.selector-logo { font-family: 'Bebas Neue', sans-serif; font-size: 72px; letter-spacing: 10px; color: #fff; line-height: 1; }
.selector-tag { font-size: 14px; font-weight: 700; color: #444; letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; margin-bottom: 48px; }
.sport-cards { display: flex; gap: 20px; }

/* PROP TRACKER */
#prop-tracker { width: 700px; max-width: 95vw; margin-top: 48px; }
.sport-card { width: 220px; padding: 36px 28px; border: 2px solid #1e1e1e; background: #0d0d0d; cursor: pointer; transition: all 0.18s; text-align: center; border-radius: 6px; position: relative; overflow: hidden; }
.sport-card::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.18s; }
.sport-card:hover { border-color: #444; transform: translateY(-4px); }
.sport-card:hover::before { opacity: 1; }
.sc-nba::before { background: linear-gradient(135deg, rgba(0,232,122,0.08) 0%, transparent 70%); }
.sc-nba:hover { border-color: var(--green); }
.sc-mlb::before { background: linear-gradient(135deg, rgba(85,170,255,0.08) 0%, transparent 70%); }
.sc-mlb:hover { border-color: var(--blue); }
.sc-val::before { background: linear-gradient(135deg, rgba(255,70,85,0.08) 0%, transparent 70%); }
.sc-val:hover { border-color: var(--val); }
.sc-golf::before { background: linear-gradient(135deg, rgba(168,224,99,0.08) 0%, transparent 70%); }
.sc-golf:hover { border-color: var(--golf); }
.dot-golf { background: var(--golf); }
.sc-icon { font-size: 48px; margin-bottom: 16px; height: 64px; display: flex; align-items: center; justify-content: center; }
.sc-sport { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 4px; margin-bottom: 6px; }
.sc-nba .sc-sport { color: var(--green); }
.sc-mlb .sc-sport { color: var(--blue); }
.sc-val .sc-sport { color: var(--val); }
.sc-golf .sc-sport { color: var(--golf); }
.sc-nfl .sc-sport { color: var(--nfl); }
.sc-desc { font-size: 12px; font-weight: 700; color: #555; letter-spacing: 1px; margin-bottom: 16px; height: 32px; display: flex; align-items: center; justify-content: center; }
.sc-status { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 3px; text-transform: uppercase; letter-spacing: 1px; display: inline-block; }
.status-live { background: #001800; color: var(--green); border: 1px solid var(--green); }
.status-today { background: #001333; color: var(--blue); border: 1px solid var(--blue); }
.status-next { background: #1a0000; color: #ff6666; border: 1px solid #661111; }
/* parlay top nav */
      .top-bar { position:fixed; top:0; left:0; right:0; height:48px; background:#080808; border-bottom:1px solid #1a1a1a; display:flex; align-items:center; padding:0 14px; z-index:10; gap:12px; }
      .top-bar-title { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:4px; color:#fff; flex:1; text-align:center; }
      .top-bar-right { font-size:10px; font-weight:800; color:#444; letter-spacing:2px; text-transform:uppercase; white-space:nowrap; }
      /* parlay page */
      .prl-card { background:#0c0c0c; border:1px solid #1e1e1e; border-radius:10px; padding:20px; margin-bottom:22px; }
      .prl-card-gold { border-color:#332800; background:#0a0900; }
      .prl-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
      .prl-title { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:4px; color:var(--green); }
      .prl-odds { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:2px; color:var(--green); }
      .prl-sub { font-size:11px; color:#555; letter-spacing:0.5px; margin-bottom:18px; line-height:1.5; }
      .prl-legs { display:flex; flex-direction:column; gap:14px; }
      .prl-leg { display:flex; gap:14px; background:#111; border-radius:8px; padding:14px; border:1px solid #1a1a1a; }
      .prl-leg-num { font-family:'Bebas Neue',sans-serif; font-size:22px; color:#333; min-width:32px; height:32px; background:#0d0d0d; border:1px solid #222; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
      .prl-leg-body { flex:1; }
      .prl-leg-sport { font-size:10px; color:#444; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
      .prl-leg-player { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; color:#fff; line-height:1; margin-bottom:4px; }
      .prl-leg-prop { font-size:14px; color:var(--green); font-weight:700; margin-bottom:4px; letter-spacing:0.5px; }
      .prl-leg-conf { font-size:11px; font-weight:800; letter-spacing:1px; margin-bottom:6px; }
      .prl-leg-why { font-size:11px; color:#555; line-height:1.6; border-top:1px solid #1a1a1a; padding-top:6px; margin-top:4px; }
      /* legacy parlay classes (unused) */
      .parlay-card { display:none; }
      .parlay-grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:16px; }
      .parlay-grid .prl-card { margin-bottom:0; height:100%; display:flex; flex-direction:column; }
      .parlay-grid .prl-legs { flex:1; }
      .prl-card-wide { grid-column: span 2; }
      .prl-conf { display:flex; align-items:center; gap:10px; margin:10px 0 14px; padding:10px 12px; background:#080808; border:1px solid #1b1b1b; border-radius:8px; }
      .prl-conf-label { font-size:10px; font-weight:900; color:#555; letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap; }
      .prl-conf-track { flex:1; height:6px; background:#1f1f1f; border-radius:999px; overflow:hidden; }
      .prl-conf-fill { height:100%; border-radius:999px; background:var(--green); }
      .prl-conf-fill.md { background:var(--amber); }
      .prl-conf-fill.lo { background:var(--red); }
      .prl-conf-num { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:1px; line-height:1; color:var(--green); min-width:52px; text-align:right; }
      .prl-conf-num.md { color:var(--amber); }
      .prl-conf-num.lo { color:var(--red); }
      @media (max-width: 820px) { .parlay-grid { grid-template-columns:1fr; } .prl-card-wide { grid-column:span 1; } }

/* PARLAY VISIBILITY UPGRADE */
.parlay-grid{align-items:stretch;}
.parlay-grid .prl-card{position:relative;overflow:hidden;padding:22px!important;border-width:1px!important;}
.parlay-grid .prl-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--green);opacity:.95;}
.parlay-grid .prl-card::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 0%, rgba(0,232,122,.10), transparent 34%);}
.parlay-grid .prl-card > *{position:relative;z-index:1;}
.parlay-grid .prl-card.full{grid-column:span 2;}
.prl-card.prl-safe{border-color:rgba(0,232,122,.55)!important;background:linear-gradient(145deg,#101814,#080908)!important;}
.prl-card.prl-alt{border-color:rgba(85,170,255,.42)!important;background:linear-gradient(145deg,#10141a,#08090b)!important;}
.prl-card.prl-best{border-color:rgba(255,187,0,.48)!important;background:linear-gradient(145deg,#171407,#090908)!important;}
.prl-card.prl-long{border-color:rgba(255,51,102,.45)!important;background:linear-gradient(145deg,#170b10,#080808)!important;}
.prl-card.prl-safe::before{background:var(--green);}
.prl-card.prl-alt::before{background:var(--blue);}
.prl-card.prl-best::before{background:var(--amber);}
.prl-card.prl-long::before{background:var(--red);}
.prl-card.prl-alt .prl-title,.prl-card.prl-alt .prl-odds{color:var(--blue)!important;}
.prl-card.prl-best .prl-title,.prl-card.prl-best .prl-odds{color:var(--amber)!important;}
.prl-card.prl-long .prl-title,.prl-card.prl-long .prl-odds{color:var(--red)!important;}
.prl-meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 12px;}
.prl-tier-pill{font-size:10px;font-weight:950;letter-spacing:1.4px;text-transform:uppercase;border-radius:999px;padding:5px 10px;border:1px solid currentColor;background:rgba(255,255,255,.035);}
.prl-safe .prl-tier-pill{color:var(--green);}
.prl-alt .prl-tier-pill{color:var(--blue);}
.prl-best .prl-tier-pill{color:var(--amber);}
.prl-long .prl-tier-pill{color:var(--red);}
.prl-meta-text{font-size:10px;font-weight:800;color:#777;letter-spacing:.4px;text-transform:uppercase;}
.prl-leg{background:linear-gradient(135deg,#111216,#0b0c0e)!important;border-color:#24262d!important;}
.prl-card.prl-safe .prl-leg-prop{color:var(--green)!important;}
.prl-card.prl-alt .prl-leg-prop{color:var(--blue)!important;}
.prl-card.prl-best .prl-leg-prop{color:var(--amber)!important;}
.prl-card.prl-long .prl-leg-prop{color:var(--red)!important;}
@media (max-width: 820px){.parlay-grid .prl-card.full{grid-column:span 1;}}

      .record-btn { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 4px; padding: 10px 28px; border: 1px solid #2a2a2a; background: #111; color: #555; border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: all 0.15s; display: inline-block; }
.record-btn:hover { border-color: #555; color: #ccc; background: #1a1a1a; }

/* FRAMES */
.sport-frame { position: fixed; inset: 0; display: none; flex-direction: column; z-index: 100; overflow: hidden; }
.sport-frame.active { display: flex; height: 100%; }
.back-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: #000; border-bottom: 2px solid #1a1a1a; display: flex; align-items: center; height: 48px; }
.back-btn { height: 48px; padding: 0 20px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; color: #555; cursor: pointer; border-right: 1px solid #1a1a1a; letter-spacing: 1px; text-transform: uppercase; transition: all 0.12s; }
.back-btn:hover { color: #fff; background: #111; }
.back-logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 4px; color: #fff; padding: 0 20px; border-right: 1px solid #1a1a1a; height: 48px; display: flex; align-items: center; }
.back-sport-label { padding: 0 20px; font-size: 12px; font-weight: 800; color: #444; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; }
.bsd { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
.dot-nba { background: var(--green); } .dot-mlb { background: var(--blue); } .dot-val { background: var(--val); }

.frame-top-spacer { height: 48px; flex-shrink: 0; }
.frame-content { margin-top: 0; padding-top: 0; overflow-y: auto; flex: 1; min-height: 0; box-sizing: border-box; }

/* SHARED */
.sport-topbar { position: sticky; top: 48px; z-index: 90; background: #000; border-bottom: 3px solid #fff; display: flex; align-items: center; }
.sport-logo-wrap { padding: 12px 24px; border-right: 1px solid #2a2a2a; }
.sport-logo { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 5px; color: #fff; line-height: 1; }
.sport-logo-sub { font-size: 10px; color: #555; font-weight: 700; margin-top: 1px; letter-spacing: 2px; text-transform: uppercase; }
.sport-nav-tabs { display: flex; flex: 1; }
.sport-nav-tab { padding: 0 24px; height: 64px; display: flex; align-items: center; font-size: 14px; font-weight: 800; text-transform: uppercase; cursor: pointer; border-right: 1px solid #1a1a1a; color: #555; transition: all 0.15s; white-space: nowrap; gap: 8px; letter-spacing: 1px; }
.sport-nav-tab:hover { color: #fff; background: #111; }
.sport-nav-tab.active { color: #fff; background: #1a1a1a; border-bottom: 3px solid #fff; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; animation: blink 1.4s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.sport-topbar-right { margin-left: auto; padding: 0 24px; font-size: 12px; font-weight: 700; color: #555; border-left: 1px solid #1a1a1a; height: 64px; display: flex; align-items: center; }
.sport-page { display: none; } .sport-page.active { display: block; }

/* HERO */
.hero { background: #000; border-bottom: 1px solid #222; padding: 32px 36px 24px; }
.hero-title { font-family: 'Bebas Neue', sans-serif; font-size: 52px; letter-spacing: 6px; line-height: 1; }
.hero-sub { font-size: 14px; color: #ddd; font-weight: 700; margin-top: 8px; }
.hero-stats { display: flex; gap: 2px; margin-top: 18px; }
.hero-stat { flex: 1; padding: 16px 20px; background: #1a1a1a; border-radius: 4px; }
.hero-stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 2px; line-height: 1; }
.hero-stat-label { font-size: 12px; color: #ddd; font-weight: 700; margin-top: 4px; }
.num-green { color: var(--green); } .num-amber { color: var(--amber); } .num-red { color: var(--red); } .num-blue { color: var(--blue); } .num-val { color: var(--val); }
.section-hdr { padding: 14px 36px 10px; font-size: 12px; font-weight: 800; color: #ddd; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #1e1e1e; display: flex; align-items: center; justify-content: space-between; }
.section-hdr span { color: #555; }

/* PICK CARDS (home/top picks pages) */
.picks-col { display: flex; flex-direction: column; gap: 2px; background: #1e1e1e; padding-bottom: 2px; }
.pick-card { background: #161616; padding: 24px 36px 20px; cursor: pointer; transition: background 0.12s, border-left-color 0.12s; position: relative; border-left: 4px solid #252525; border-bottom: 1px solid #111; }
.pick-card:hover { background: #1e1e1e; border-left-color: #444; }
.pc-rank { font-size: 12px; font-weight: 800; color: #555; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
.pc-player { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 2px; line-height: 1; margin-bottom: 2px; }
.pc-prop { font-size: 13px; font-weight: 700; color: #ddd; margin-bottom: 16px; }
.pc-line-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.pc-line { font-family: 'Bebas Neue', sans-serif; font-size: 54px; letter-spacing: 2px; line-height: 1; color: #fff; }
.pc-dir { font-size: 13px; font-weight: 900; letter-spacing: 2px; padding: 6px 14px; text-transform: uppercase; border-radius: 4px; }
.dir-over { color: #000; background: var(--green); } .dir-under { color: #000; background: var(--red); }
.pc-proj { font-size: 13px; font-weight: 700; color: #ddd; margin-bottom: 16px; }
.pc-proj strong { color: #fff; font-size: 16px; font-weight: 900; }
.pc-conf-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.conf-label { font-size: 12px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
.conf-track { flex: 1; height: 6px; background: #2a2a2a; border-radius: 4px; }
.conf-fill { height: 100%; border-radius: 4px; }
.cf-hi { background: var(--green); } .cf-md { background: var(--amber); } .cf-lo { background: var(--red); }
.conf-num { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 1px; line-height: 1; min-width: 68px; text-align: right; }
.conf-num.hi { color: var(--green); } .conf-num.md { color: var(--amber); } .conf-num.lo { color: var(--red); }
.pc-tag { font-size: 12px; font-weight: 700; color: #ddd; line-height: 1.65; padding-top: 12px; border-top: 1px solid #222; }
.pc-badge { position: absolute; top: 20px; right: 28px; font-size: 11px; font-weight: 900; letter-spacing: 1px; padding: 4px 10px; text-transform: uppercase; border-radius: 3px; }
.badge-lock { background: #fff; color: #000; } .badge-hot { background: var(--amber); color: #000; }
.badge-value { background: var(--green); color: #000; } .badge-combo { background: var(--blue); color: #000; }
/* Color-coded left border by pick type */
.pick-card:has(.badge-lock) { border-left-color: #666; }
.pick-card:has(.badge-value) { border-left-color: var(--green); }
.pick-card:has(.badge-hot) { border-left-color: var(--amber); }
.pick-card:has(.badge-combo) { border-left-color: var(--blue); }
/* Prop row borders by confidence */
.prop-row:has(.cf-hi) { border-left-color: #2a2a2a; }
.prop-row:has(.pr-conf-num.hi) { border-left-color: var(--green); }
.prop-row:has(.pr-conf-num.md) { border-left-color: #333; }
.prop-row:has(.pr-conf-num.lo) { border-left-color: var(--red); }

/* GAME TABS */
.game-topbar { background: #0a0a0a; border-bottom: 1px solid #222; display: flex; overflow-x: auto; }
.game-tab { flex: 0 0 auto; padding: 14px 16px; text-align: center; cursor: pointer; border-right: 1px solid #1a1a1a; color: #555; transition: all 0.15s; min-width: 120px; }
.game-tab:last-child { border-right: none; }
.game-tab.active { color: #fff; background: #1a1a1a; border-bottom: 3px solid #fff; }
.game-tab:hover:not(.active) { color: #ccc; background: #141414; }
.gtb-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; }
.gtb-meta { font-size: 10px; font-weight: 700; color: #666; margin-top: 3px; }
.game-tab.active .gtb-meta { color: #999; }
.game-panel { display: none; } .game-panel.active { display: block; }

/* GAME BANNER */
.game-banner { background: #0a0a0a; border-bottom: 1px solid #222; padding: 18px 36px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.gb-matchup { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 3px; }
.gb-left .gb-matchup { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 3px; }
.gb-info, .gb-left .gb-info { font-size: 12px; font-weight: 700; color: #ddd; margin-top: 3px; }
.gb-right { text-align: right; }
.gb-chip { font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 5px 12px; border: 2px solid; text-transform: uppercase; display: inline-block; border-radius: 3px; }
.gb-context { font-size: 12px; font-weight: 700; color: #ddd; margin-top: 6px; line-height: 1.5; }

/* INJURIES */
.inj-bar { border-bottom: 1px solid #1a1a1a; }
.inj-title { font-size: 11px; font-weight: 800; color: #ddd; text-transform: uppercase; letter-spacing: 2px; padding: 10px 36px; border-bottom: 1px solid #1a1a1a; }
.inj-list { padding: 12px 36px; display: flex; flex-wrap: wrap; gap: 8px; }
.inj-card { border: 2px solid; padding: 10px 14px; min-width: 190px; border-radius: 4px; }
.inj-out { border-color: #882222; background: #1a0000; color: #ff6666; }
.inj-q { border-color: #886600; background: #1a1000; color: #ffcc44; }
.inj-ok { border-color: #226622; background: #001800; color: #55ff99; }
.inj-name { font-size: 13px; font-weight: 900; }
.inj-st { font-size: 11px; font-weight: 700; margin-top: 3px; }
.inj-fx { font-size: 11px; font-weight: 600; color: #ddd; margin-top: 4px; line-height: 1.5; }

/* PROP FILTERS */
.prop-filters { display: flex; border-bottom: 1px solid #1e1e1e; background: #0a0a0a; overflow-x: auto; }
.pf-btn { flex: 0 0 auto; padding: 12px 14px; font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; border: none; border-right: 1px solid #1a1a1a; background: transparent; color: #555; cursor: pointer; transition: all 0.12s; }
.pf-btn:last-child { border-right: none; }
.pf-btn.active, .pf-btn:hover { background: #1a1a1a; color: #fff; }

/* PROP ROWS */
.prop-row { border-bottom: 1px solid #1a1a1a; border-left: 4px solid #1e1e1e; padding: 20px 36px; transition: background 0.1s, border-left-color 0.1s; }
.prop-row:last-child { border-bottom: none; }
.prop-row:hover { background: #141414; border-left-color: #333; }
.pr-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.pr-player { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; line-height: 1; }
.pr-type { font-size: 12px; font-weight: 700; color: #ddd; margin-top: 4px; }
.pr-badges { display: flex; gap: 6px; flex-shrink: 0; }
.pr-badge { font-size: 11px; font-weight: 900; letter-spacing: 1px; padding: 4px 10px; text-transform: uppercase; border-radius: 3px; }

// ONYX scoring model. No prop category is banned. The model boosts or penalizes by evidence.
const PROP_WEIGHTS = {
  FGM: 10,
  PRA: 9,
  'P+R': 9,
  'P+A': 9,
  FTM: 8,
  FTA: 7,
  '3PM': 7,
  FGA: 6,
  REB: 5,
  PTS: 4,
  AST: 3,
  KS: 8,
  TB: 7,
  'H+R+RBI': 6,
  RBI: 5,
  HR: 3,
  OTHER: 2
};
function getLineDirection(line){
  const l = (line || '').toUpperCase();
  if (l.includes(' UNDER ') || l.includes(' LESS ')) return 'UNDER';
  if (l.includes(' OVER ') || l.includes(' MORE ')) return 'OVER';
  return 'PROP';
}
function getPropKey(line){
  const l = (line || '').toUpperCase();
  if (l.includes('PRA')) return 'PRA';
  if (l.includes('PTS+REB') || l.includes('P+R')) return 'P+R';
  if (l.includes('PTS+AST') || l.includes('P+A')) return 'P+A';
  if (l.includes('3PM')) return '3PM';
  if (l.includes('3PA')) return 'FGA';
  if (l.includes('FGM')) return 'FGM';
  if (l.includes('FGA')) return 'FGA';
  if (l.includes('FTM')) return 'FTM';
  if (l.includes('FTA')) return 'FTA';
  if (l.includes('AST')) return 'AST';
  if (l.includes('REB')) return 'REB';
  if (l.includes('PTS')) return 'PTS';
  if (l.includes('KS') || l.includes('K ')) return 'KS';
  if (l.includes('TOTAL BASE') || l.includes('TB ')) return 'TB';
  if (l.includes('H+R+RBI') || l.includes('HITS+RUNS+RBI')) return 'H+R+RBI';
  if (l.includes('RBI')) return 'RBI';
  if (l.includes('HR') || l.includes('HOME RUN')) return 'HR';
  return 'OTHER';
}
function getHistoryAdjustment(propKey){
  const graded = PICK_RECORD.filter(p => isGradedPick(p) && getPropKey(p.line) === propKey);
  if (graded.length < 3) return 0;
  const wins = graded.filter(p => p.result === 'W').length;
  const pct = wins / graded.length;
  if (pct >= 0.75) return 5;
  if (pct >= 0.65) return 3;
  if (pct < 0.45) return -10;
  if (pct < 0.55) return -5;
  return 0;
}
function scorePropCandidate({line, fdEdge=0, recentHitRate=null, usageSpike=false, matchup=0, minutesSecure=true, volatility=0, redFlag=false}){
  const propKey = getPropKey(line);
  let conf = 50;
  conf += (PROP_WEIGHTS[propKey] || PROP_WEIGHTS.OTHER) * 0.6;
  if (fdEdge >= 2) conf += 15;
  else if (fdEdge >= 1) conf += 10;
  else if (fdEdge >= 0.5) conf += 5;
  else if (fdEdge < -0.5) conf -= 8;
  if (recentHitRate !== null) {
    if (recentHitRate >= 0.80) conf += 12;
    else if (recentHitRate >= 0.70) conf += 8;
    else if (recentHitRate < 0.50) conf -= 8;
  }
  if (usageSpike) conf += 8;
  conf += matchup;
  if (!minutesSecure) conf -= 8;
  conf -= volatility;
  if (redFlag) conf -= 10;
  conf += getHistoryAdjustment(propKey);
  return Math.max(1, Math.min(95, Math.round(conf)));
}
function getTier(conf){
  if (conf >= 80) return 'BEST PICK';
  if (conf >= 70) return 'LEAN';
  return 'RESEARCH';
}

function isPendingPick(p){ return !p.result; }
function isGradedPick(p){ return p.result === 'W' || p.result === 'L'; }
function isVoidPick(p){ return p.result === 'VOID' || p.result === 'DNP' || p.result === 'NO ACTION'; }
function recordStatusOk(p){
  if (recordStatusFilter === 'graded') return isGradedPick(p);
  if (recordStatusFilter === 'pending') return isPendingPick(p);
  return true;
}
function getPropType(line){
  const l = (line || '').toUpperCase();
  if (l.includes('PRA')) return 'NBA PRA';
  if (l.includes('PTS+REB') || l.includes('P+R')) return 'NBA P+R';
  if (l.includes('PTS+AST') || l.includes('P+A')) return 'NBA P+A';
  if (l.includes('3PM')) return 'NBA 3PM';
  if (l.includes('3PA')) return 'NBA 3PA';
  if (l.includes('FGM')) return 'NBA FGM';
  if (l.includes('FTM') || l.includes('FTA')) return 'NBA FT';
  if (l.includes('REB')) return 'NBA REB';
  if (l.includes('PTS')) return 'NBA PTS';
  if (l.includes('KS') || l.includes('K ')) return 'MLB Ks';
  if (l.includes('TOTAL BASE') || l.includes('TB ')) return 'MLB Total Bases';
  if (l.includes('H+R+RBI') || l.includes('HITS+RUNS+RBI')) return 'MLB H+R+RBI';
  if (l.includes('RBI')) return 'MLB RBI';
  if (l.includes('HR') || l.includes('HOME RUN')) return 'MLB HR';
  if (l.includes('STROKE')) return 'GOLF Strokes';
  if (l.includes('BIRD')) return 'GOLF Birdies or Better';
  if (l.includes('PAR') && !l.includes('BOGEY')) return 'GOLF Pars';
  if (l.includes('BOGEY') || l.includes('WORSE')) return 'GOLF Bogeys or Worse';
  if (l.includes('FAIRWAY')) return 'GOLF Fairways Hit';
  if (l.includes('GREEN') || l.includes('GIR')) return 'GOLF Greens in Regulation';
  return 'Other';
}
function bucketConf(conf){
  if (conf >= 90) return '90%+';
  if (conf >= 80) return '80-89%';
  if (conf >= 70) return '70-79%';
  if (conf >= 60) return '60-69%';
  return '<60%';
}
function recordPct(w,l){ const d=w+l; return d ? Math.round(w/d*100) : null; }
function renderMiniTable(title, rows, labelName){
  const body = rows.length ? rows.map(r => {
    const pct = recordPct(r.w,r.l);
    const color = pct === null ? '#444' : pct >= 70 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)';
    return `<div style="display:grid;grid-template-columns:1fr 60px 60px 70px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #171717;">
      <div style="font-size:11px;font-weight:900;color:#ddd">${r.name}</div>
      <div style="font-size:11px;font-weight:800;color:#555;text-align:right">${r.w}-${r.l}</div>
      <div style="font-size:11px;font-weight:800;color:#555;text-align:right">${r.pending} pend</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:${color};text-align:right">${pct !== null ? pct+'%' : '–'}</div>
    </div>`;
  }).join('') : `<div style="font-size:11px;color:#444;font-weight:800;padding:14px 0">NO GRADED DATA YET</div>`;
  return `<div style="background:#0d0d0d;border:1px solid #1e1e1e;border-radius:6px;padding:14px;flex:1;min-width:260px;">
    <div style="font-size:10px;font-weight:900;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">${title}</div>
    <div style="display:grid;grid-template-columns:1fr 60px 60px 70px;gap:8px;padding-bottom:5px;border-bottom:1px solid #222;font-size:9px;font-weight:900;color:#333;letter-spacing:1px;text-transform:uppercase">
      <div>${labelName}</div><div style="text-align:right">W-L</div><div style="text-align:right">Open</div><div style="text-align:right">Hit</div>
    </div>${body}
  </div>`;
}
function renderRecordAnalytics(scopePicks){
  const typeMap = {}, bucketMap = {};
  scopePicks.forEach(p => {
    const type = getPropType(p.line);
    if (!typeMap[type]) typeMap[type] = {name:type,w:0,l:0,pending:0};
    if (p.result === 'W') typeMap[type].w++;
    else if (p.result === 'L') typeMap[type].l++;
    else if (!p.result) typeMap[type].pending++;
    const b = bucketConf(p.conf || 0);
    if (!bucketMap[b]) bucketMap[b] = {name:b,w:0,l:0,pending:0};
    if (p.result === 'W') bucketMap[b].w++;
    else if (p.result === 'L') bucketMap[b].l++;
    else if (!p.result) bucketMap[b].pending++;
  });
  const typeRows = Object.values(typeMap).sort((a,b)=> (b.w+b.l+b.pending)-(a.w+a.l+a.pending));
  const bucketOrder = {'90%+':0,'80-89%':1,'70-79%':2,'60-69%':3,'<60%':4};
  const bucketRows = Object.values(bucketMap).sort((a,b)=>(bucketOrder[a.name]??9)-(bucketOrder[b.name]??9));
  const graded = scopePicks.filter(isGradedPick).length;
  const pending = scopePicks.filter(isPendingPick).length;
  const bestTypes = typeRows.filter(r => (r.w+r.l) >= 3).sort((a,b)=> (recordPct(b.w,b.l)??-1)-(recordPct(a.w,a.l)??-1)).slice(0,3).map(r=>`${r.name} ${recordPct(r.w,r.l)}%`).join(' · ');
  return `<div style="margin-bottom:20px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;flex-wrap:wrap;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:#fff">AUTO EDGE AUDIT + LEARNING MODEL</div>
      <div style="font-size:10px;font-weight:800;color:#444;letter-spacing:1px;text-transform:uppercase">${graded} graded · ${pending} pending${bestTypes ? ' · Best: '+bestTypes : ''}</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      ${renderMiniTable('Prop Type Performance', typeRows, 'Type')}
      ${renderMiniTable('Confidence Calibration', bucketRows, 'Bucket')}
    </div>
    
  </div>`;
}

function buildParlayRecord() {
  const base = recordView === 'week'
    ? PARLAY_RECORD.filter(p => p.date >= WEEK_START && p.date <= WEEK_END)
    : PARLAY_RECORD.filter(p => p.date < WEEK_START);

  const byDate = {};
  base.forEach(p => {
    if (!byDate[p.date]) byDate[p.date] = [];
    byDate[p.date].push(p);
  });
  const dates = Object.keys(byDate).sort();

  const totalW    = base.filter(p => p.result === 'W').length;
  const totalL    = base.filter(p => p.result === 'L').length;
  const totalDone = totalW + totalL;
  const pct       = totalDone > 0 ? Math.round(totalW / totalDone * 100) : null;
  const pctColor  = pct === null ? '#555' : pct >= 50 ? 'var(--green)' : pct >= 30 ? 'var(--amber)' : 'var(--red)';

  const legColor = l => l===2?'var(--green)':l===3?'var(--blue)':l===4?'var(--amber)':l<=5?'#ff6666':'#cc4444';
  const legLabel = l => l===2?'2-LEG':l===3?'3-LEG':l===4?'4-LEG':l===5?'5-LEG':'6-LEG';

  const dayCards = dates.map(date => {
    const parlays = byDate[date];
    const dW = parlays.filter(p => p.result === 'W').length;
    const dL = parlays.filter(p => p.result === 'L').length;
    const dDone = dW + dL;
    const isOpen = dDone === 0;
    const cardId = 'prl-day-' + date;
    const d = new Date(date + 'T12:00:00');
    const dateLabel = d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}).toUpperCase();

    let statusColor, statusText;
    if (dDone === 0)       { statusColor='#555';         statusText = parlays.length + ' PARLAYS · PENDING'; }
    else if (dW === dDone) { statusColor='var(--green)'; statusText = dW+'/'+dDone+' · ALL HIT'; }
    else if (dW > 0)       { statusColor='var(--amber)'; statusText = dW+'/'+dDone+' HIT'; }
    else                   { statusColor='var(--red)';   statusText = '0/'+dDone+' MISS'; }

    const rows = parlays.map(p => {
      const icon = p.result === 'W' ? '✓' : p.result === 'L' ? '✗' : (p.result === 'VOID' ? '○' : '·');
      const rc   = p.result === 'W' ? 'var(--green)' : p.result === 'L' ? 'var(--red)' : (p.result === 'VOID' ? '#888' : '#333');
      const legsHtml = p.picks.map((pick, i) => `
        <div style="font-size:11px;color:#555;padding:2px 0 2px 8px;border-left:2px solid #1e1e1e;margin-top:3px;">
          <span style="color:#333;font-weight:900;">${i+1}.</span> ${pick}
        </div>`).join('');
      return `
        <div style="padding:12px 0;border-bottom:1px solid #1a1a1a;">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:${rc};min-width:20px;text-align:center">${icon}</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;color:${legColor(p.legs)};padding:2px 8px;border:1px solid ${legColor(p.legs)};border-radius:3px;">${legLabel(p.legs)}</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:${legColor(p.legs)}">${p.odds}</div>
            <div style="flex:1;text-align:right;font-size:10px;color:#444;font-weight:800;letter-spacing:1px">${p.result===''?'PENDING':p.result==='W'?'HIT ✓':p.result==='VOID'?'VOID ○':'MISS ✗'}</div>
          </div>
          <div style="padding-left:32px;">${legsHtml}</div>
        </div>`;
    }).join('');

    return `
      <div style="background:#0d0d0d;border:1px solid #1e1e1e;border-radius:6px;margin-bottom:10px;overflow:hidden;">
        <div onclick="(function(){var b=document.getElementById('${cardId}');var a=document.getElementById('${cardId}-arr');if(b.style.display==='none'){b.style.display='block';a.textContent='▲';}else{b.style.display='none';a.textContent='▼';}})()" style="display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:#111;cursor:pointer;user-select:none;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;color:#ddd">${dateLabel}</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;color:#333">${parlays.length} PARLAYS</div>
          </div>
          <div style="display:flex;align-items:center;gap:14px;">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:17px;color:${statusColor}">${statusText}</div>
            <div id="${cardId}-arr" style="font-size:11px;color:#444">${isOpen?'▲':'▼'}</div>
          </div>
        </div>
        <div id="${cardId}" style="display:${isOpen?'block':'none'};padding:0 16px 6px">${rows}</div>
      </div>`;
  }).join('');

  const legStats = [2,3,4,5,6].map(legs => {
    const lw = base.filter(p=>p.legs===legs&&p.result==='W').length;
    const ll = base.filter(p=>p.legs===legs&&p.result==='L').length;
    const ld = lw+ll;
    return `<div style="flex:1;min-width:80px;background:#111;border:1px solid #1e1e1e;border-radius:5px;padding:10px 12px;border-top:2px solid ${legColor(legs)}">

      <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:#fff">${ld>0?lw+'/'+ld:'–'}</div>
    </div>`;
  }).join('');

  document.getElementById('frame-record').innerHTML = `

  <div class="back-logo">ONYX</div>

    <span onclick="switchRecordTab('parlays')" style="cursor:pointer;font-size:12px;font-weight:900;letter-spacing:2px;padding:4px 10px;border-radius:4px;border:1px solid var(--green);background:var(--green);color:#000">PARLAYS</span>
  </div>
</div>
<div class="frame-content" style="background:#0a0a0a;"><div class="frame-top-spacer"></div>
  <div style="max-width:720px;margin:0 auto;padding:28px 24px;">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px;">
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:6px;color:#fff">PARLAY RECORD</div>
        <div style="font-size:11px;font-weight:800;color:#444;letter-spacing:2px;text-transform:uppercase;margin-top:2px">${recordView === 'week' ? 'THIS WEEK: MAY 11-MAY 17' : 'ARCHIVE: MAY 3 AND PRIOR'} · All legs must hit · ${UPDATED_DATE}</div>
        <div style="display:flex;gap:6px;margin-top:10px;">
          <div onclick="recordView='week';buildParlayRecord();" id="prl-toggle-week" style="font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:4px;cursor:pointer;border:1px solid #fff;background:#fff;color:#000">THIS WEEK</div>
          <div onclick="recordView='all';buildParlayRecord();" id="prl-toggle-all" style="font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:4px;cursor:pointer;border:1px solid #333;background:transparent;color:#555">ALL TIME</div>
        </div>
      </div>
      <div style="display:flex;gap:24px;align-items:flex-end">
        <div style="text-align:center"><div style="font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:1;color:var(--green)">${totalW}</div><div style="font-size:10px;font-weight:800;color:#444;letter-spacing:1px;text-transform:uppercase">HIT</div></div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:40px;color:#222;padding-bottom:14px">–</div>
        <div style="text-align:center"><div style="font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:1;color:var(--red)">${totalL}</div><div style="font-size:10px;font-weight:800;color:#444;letter-spacing:1px;text-transform:uppercase">MISS</div></div>
        <div style="border-left:1px solid #1e1e1e;padding-left:24px;text-align:center"><div style="font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;color:${pctColor}">${pct!==null?pct+'%':'–%'}</div><div style="font-size:10px;font-weight:800;color:#444;letter-spacing:1px;text-transform:uppercase">Hit Rate</div></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">${legStats}</div>
    ${dayCards || '<div style="text-align:center;padding:40px;color:#333;font-weight:800;letter-spacing:2px;font-size:13px">NO PARLAY RESULTS YET</div>'}
    <div style="margin-top:8px;font-size:10px;font-weight:700;color:#333;letter-spacing:1px;text-align:center;text-transform:uppercase">All legs must hit · Graded nightly · ONYX</div>
  </div>
</div>`;

  const pw = document.getElementById('prl-toggle-week');
  const pa = document.getElementById('prl-toggle-all');
  if (pw && pa) {
    const onCss  = 'font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:4px;cursor:pointer;border:1px solid #fff;background:#fff;color:#000';

function openParlay() {
  document.getElementById('sport-selector').classList.add('hidden');
  document.querySelectorAll('.sport-frame').forEach(f => f.classList.remove('active'));
  const frame = document.getElementById('frame-parlay');
  if (!frame.dataset.loaded) { frame.innerHTML = PARLAY_HTML; frame.dataset.loaded = '1'; }
  frame.classList.add('active');
}
function closeParlay() {
  document.getElementById('frame-parlay').classList.remove('active');
  document.getElementById('sport-selector').classList.remove('hidden');
}

function switchRecordTab(tab) {
  recordTab = tab;
  if (tab === 'parlays') buildParlayRecord();
  else buildRecord();
  document.getElementById('frame-record').classList.add('active');
}

function openRecord(confMin, tab) {
  if (confMin !== undefined) recordConfMin = confMin;
  if (tab) recordTab = tab;
  document.getElementById('sport-selector').classList.add('hidden');
  document.querySelectorAll('.sport-frame').forEach(f => f.classList.remove('active'));
  if (recordTab === 'parlays') buildParlayRecord();
  else buildRecord();
  document.getElementById('frame-record').classList.add('active');
}
function closeRecord() {
  document.getElementById('frame-record').classList.remove('active');
  document.getElementById('sport-selector').classList.remove('hidden');
}

// ONYX patched sport-frame navigation for May 6 standalone pages
function openSport(sport) {
  const selector = document.getElementById('sport-selector');
  if (selector) selector.classList.add('hidden');
  document.querySelectorAll('.sport-frame').forEach(f => f.classList.remove('active'));
  const frame = document.getElementById('frame-' + sport);
  if (!frame) return;
  if (!frame.dataset.loaded) {
    buildFrame(sport);
    frame.dataset.loaded = '1';
  }
  frame.classList.add('active');
}

function closeSport() {
  document.querySelectorAll('.sport-frame').forEach(f => f.classList.remove('active'));
  const selector = document.getElementById('sport-selector');
  if (selector) selector.classList.remove('hidden');
}

function buildFrame(sport) {
  const frame = document.getElementById('frame-' + sport);
  if (!frame) return;
  if (sport === 'nba' && typeof NBA_HTML !== 'undefined') frame.innerHTML = NBA_HTML;
  else if (sport === 'mlb' && typeof MLB_HTML !== 'undefined') frame.innerHTML = MLB_HTML;
  else if (sport === 'golf' && typeof GOLF_HTML !== 'undefined') frame.innerHTML = GOLF_HTML;
  else if (sport === 'nfl' && typeof NFL_HTML !== 'undefined') frame.innerHTML = NFL_HTML;
}
</script>


<script id="onyx-color-normalizer">
(function(){
  function onyxColor(pct){
    if (pct >= 80) return getComputedStyle(document.documentElement).getPropertyValue('--green').trim() || '#00e87a';
    if (pct >= 70) return getComputedStyle(document.documentElement).getPropertyValue('--amber').trim() || '#ffbb00';
    return getComputedStyle(document.documentElement).getPropertyValue('--red').trim() || '#ff3366';
  }
  function firstPct(node){
    var text = (node && node.textContent) ? node.textContent : '';
    var m, vals=[], re=/(\d{2,3})\s*%/g;
    while((m=re.exec(text))){ var v=parseInt(m[1],10); if(v>=0 && v<=100) vals.push(v); }
    if(!vals.length) return null;
    vals.sort(function(a,b){return b-a;});
    return vals[0];
  }
  window.normalizeOnyxColors = function(){
    document.querySelectorAll('.pick-card,.prop-row,.prl-card').forEach(function(card){
      var pct = firstPct(card);
      if (pct === null) return;
      var color = onyxColor(pct);
      card.style.borderLeftColor = color;
      card.querySelectorAll('.conf-num,.pr-conf-num,.prl-conf-num,.conf-pct,.confidence-num,[class*="conf-num"]').forEach(function(el){
        if (/%/.test(el.textContent)) el.style.color = color;
      });
      card.querySelectorAll('.conf-fill,.pr-conf-fill,.prl-conf-fill,.cf,.mini-fill').forEach(function(el){
        var w = parseFloat((el.style.width || '').replace('%',''));
        el.style.background = onyxColor(!isNaN(w) ? w : pct);
      });
      card.querySelectorAll('.pc-line,.pr-line,.big-line,.line-main,.c-line').forEach(function(el){
        el.style.color = color;
      });
      card.querySelectorAll('.pc-dir,.pr-dir,.dir-pill').forEach(function(el){
        el.style.color = color;
        el.style.borderColor = color;
      });
      card.querySelectorAll('.pc-badge,.badge,.verdict').forEach(function(el){
        if (/%/.test(el.textContent)) {
          el.style.color = color;
          el.style.borderColor = color;
        }
      });
    });
  };
  document.addEventListener('DOMContentLoaded', function(){ normalizeOnyxColors(); setTimeout(normalizeOnyxColors,250); });
  document.addEventListener('click', function(){ setTimeout(normalizeOnyxColors,80); });
})();
</script>


<script id="onyx-parent-color-normalizer">
(function(){
  function cssVar(name, fallback){
    try { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback; }
    catch(e){ return fallback; }
  }
  function colorFor(pct){
    if (pct >= 80) return cssVar('--green', '#00e87a');
    if (pct >= 70) return cssVar('--amber', '#ffbb00');
    return cssVar('--red', '#ff3366');
  }
  function confidenceFrom(node){
    if(!node) return null;
    var zones = ['.conf','.conf-num','.confidence','.pc-badge','.pill','.badge','.conf-pct','.pr-conf-num','.prl-conf-num'];
    for(var i=0;i<zones.length;i++){
      var el = node.matches && node.matches(zones[i]) ? node : node.querySelector(zones[i]);
      if(el){
        var m = (el.textContent || '').match(/(\d{2,3})\s*%/);
        if(m){ var v=parseInt(m[1],10); if(v>=0 && v<=100) return v; }
      }
    }
    var text = node.textContent || '', match, vals=[], re=/(\d{2,3})\s*%/g;
    while((match=re.exec(text))){ var n=parseInt(match[1],10); if(n>=0 && n<=100) vals.push(n); }
    if(!vals.length) return null;
    vals.sort(function(a,b){return b-a;});
    return vals[0];
  }
  function tint(root){
    (root || document).querySelectorAll('.prop-card,.pick-card,.prop-row,.pcard,.mlb-card,.golf-card,.prl-card').forEach(function(card){
      var pct = confidenceFrom(card);
      if(pct === null) return;
      var color = colorFor(pct);
      card.style.borderLeftColor = color;
      card.style.setProperty('--accent', color);

<script id="onyx-prop-deep-dive-script">
(function(){

  function clean(t){return (t||'').replace(/\s+/g,' ').trim();}

  function pctFrom(card){var text=clean(card.textContent),m,vals=[],re=/(\d{2,3})\s*%/g;while((m=re.exec(text))){var n=parseInt(m[1],10);if(n>=0&&n<=100)vals.push(n)} if(!vals.length)return 70; vals.sort(function(a,b){return b-a}); return vals[0];}
  function inferSport(card){var txt=clean(card.textContent).toUpperCase(); var frame=(card.closest('.sport-frame')&&card.closest('.sport-frame').id||'').toUpperCase(); if(txt.indexOf('NFL')>-1||frame.indexOf('NFL')>-1)return 'NFL'; if(txt.indexOf('MLB')>-1||txt.indexOf('KS')>-1||txt.indexOf('TOTAL BASE')>-1||frame.indexOf('MLB')>-1)return 'MLB'; if(txt.indexOf('GOLF')>-1||txt.indexOf('TRUIST')>-1||txt.indexOf('ROUND 1')>-1||frame.indexOf('GOLF')>-1)return 'GOLF'; if(txt.indexOf('NBA')>-1||txt.indexOf('PRA')>-1||txt.indexOf('PTS')>-1||txt.indexOf('REB')>-1||txt.indexOf('AST')>-1||frame.indexOf('NBA')>-1)return 'NBA'; return 'PROP';}

    function finish(boost){
      return boost+' The logic is still tied to the data: recent performance can raise or lower the confidence only when it connects to real opportunity, like minutes, touches, shot volume, lineup spot, pitch count, matchup, course fit, or weather. It is not guessing that a player will magically play better; it is asking whether the most recent result makes the next-game or next-round path more believable.';
    }

      if(strong && over) return finish(p+' is treated as a continuation play rather than a bounce-back play. The recent form supports staying aggressive, but the prop still needs the line to be fair so the model is not chasing one hot game.');

    }

      if(/HR|Home Run/i.test(prop)) return finish(p+' is a high-variance power read. Recent hard contact and matchup can justify tracking it, but the confidence has to stay lower because one swing decides the result.');
      return finish(p+' is evaluated through recent contact quality, lineup spot, handedness split, and opposing pitcher weakness. A cold box score only helps if the player is still getting chances and the matchup gives the bat a believable rebound path.');
    }
    if(sport==='GOLF'){
      if(/fairway/i.test(prop)) return finish(p+' is evaluated by round position and aggression. If the player has to chase after a poor round, fairways can become less stable because he may swing harder, so this market is safest when the golfer is controlled rather than desperate.');

  function openDive(card){var d=extract(card), adj=logicAdj(d.conf,d.why,d.prop), final=Math.max(1,Math.min(95,d.conf)), dataBase=Math.max(1,Math.min(95,final-adj)), cat=propKey(d.prop);var overlay=document.getElementById('onyx-dd-overlay'); if(!overlay){overlay=document.createElement('div');overlay.id='onyx-dd-overlay';overlay.className='onyx-dd-overlay';document.body.appendChild(overlay);} var chips=d.stats.length?d.stats.map(function(x){return '<div class="onyx-dd-pill">'+htmlEscape(x)+'</div>';}).join(''):'<div class="onyx-dd-pill"><b>Record learning:</b> confidence adjusts by prior ONYX results and prop type.</div><div class="onyx-dd-pill"><b>Market check:</b> line is playable only if it still matches the edge.</div><div class="onyx-dd-pill"><b>Role:</b> minutes, usage, and opportunity are part of the score.</div><div class="onyx-dd-pill"><b>Volatility:</b> risk is kept visible before locking the pick.</div>'; overlay.innerHTML='<div class="onyx-dd-panel" role="dialog" aria-modal="true"><div class="onyx-dd-top"><div><div class="onyx-dd-kicker">'+htmlEscape(d.sport)+' PROP PANEL · '+confidenceClass(final)+'</div><div class="onyx-dd-player">'+htmlEscape(d.player)+'</div><div class="onyx-dd-prop">'+htmlEscape(d.prop)+'</div></div><button class="onyx-dd-close" aria-label="Close">×</button></div><div class="onyx-dd-body"><div class="onyx-dd-scoreboard"><div class="onyx-dd-stat primary"><div class="onyx-dd-label">Final Confidence</div><div class="onyx-dd-value" style="color:var(--green,#00e87a)">'+final+'%</div><div class="onyx-dd-sub">'+htmlEscape(confidenceClass(final))+' · updated by data and logic</div></div><div class="onyx-dd-stat"><div class="onyx-dd-label">Line</div><div class="onyx-dd-value">'+htmlEscape(d.line)+'</div><div class="onyx-dd-sub">'+htmlEscape(d.dir||'current number')+'</div></div><div class="onyx-dd-stat"><div class="onyx-dd-label">Projection</div><div class="onyx-dd-value">'+htmlEscape(d.proj)+'</div><div class="onyx-dd-sub">model read</div></div><div class="onyx-dd-stat"><div class="onyx-dd-label">Category</div><div class="onyx-dd-value">'+htmlEscape(cat)+'</div><div class="onyx-dd-sub">data baseline '+dataBase+'% · logic '+(adj>=0?'+':'')+adj+'</div></div></div><div class="onyx-dd-left"><div class="onyx-dd-section compact"><div class="onyx-dd-title">Why It Was Chosen</div><div class="onyx-dd-text">'+htmlEscape(d.why)+'</div></div><div class="onyx-dd-section compact"><div class="onyx-dd-title">Data Board</div><div class="onyx-dd-list">'+chips+'</div></div><div class="onyx-dd-section onyx-dd-logic"><div class="onyx-dd-title">ONYX Logic</div><div class="onyx-dd-logic-text">'+htmlEscape(onyxLogic(d))+'</div></div></div><div class="onyx-dd-right"><div class="onyx-dd-section compact"><div class="onyx-dd-title">Confidence Build</div>'+renderBars(final,adj)+'</div><div class="onyx-dd-section compact onyx-dd-risk"><div class="onyx-dd-title">Risk Check</div><div class="onyx-dd-text">Can still miss if minutes, role, game script, shooting variance, weather, course conditions, or late news move against it. Risk stays visible instead of hidden below the fold.</div></div><div class="onyx-dd-section compact"><div class="onyx-dd-title">At A Glance</div><div class="onyx-dd-footer"><div class="onyx-dd-mini"><b>Data First</b><span>Stats, line value, prop history, matchup, and role.</span></div><div class="onyx-dd-mini"><b>ONYX Logic</b><span>Recent form, role, motivation, and risk are checked against the data path.</span></div></div></div></div></div></div>'; overlay.classList.add('active'); overlay.querySelector('.onyx-dd-close').onclick=closeDive; overlay.onclick=function(e){if(e.target===overlay)closeDive();};}

<script id="onyx-remove-debug-flags">
