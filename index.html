function hrPage(){return `<div class="parlay-grid">${HR_SLIPS.map(p=>`<div class="parlay"><h3>${p.title}</h3><p><b>RISKY / LOTTERY ONLY</b></p>${p.legs.map(l=>`<div class="leg">${l}</div>`).join('')}<p style="margin-top:14px">${p.why}</p></div>`).join('')}</div>`}
function recordPage(s){let rows=s?RECORD_ROWS.filter(r=>r.sport.toLowerCase()===s):RECORD_ROWS;return `<div class="info-grid"><div class="info" style="grid-column:1/-1"><h3>Full Record - Pending June 24</h3><p>Pending rows only for active MLB and Golf props. NBA and NFL are inactive, so they do not create stale record entries.</p><div class="table"><div class="record-row"><span>Date</span><span>Sport</span><span>Player</span><span>Prop</span><span>Result</span></div>${rows.map(r=>`<div class="record-row"><span>${r.date}</span><span>${r.sport}</span><span>${r.player}</span><span>${r.prop}</span><span>${r.result}</span></div>`).join('')}</div></div></div>`}
function openParlays(){document.getElementById('home').style.display='none';document.getElementById('app').classList.add('active');window.currentSport='golf';setAccent('golf');setTabs(['Parlays','Record'],'Parlays');content.innerHTML=`<div class="hero"><h1>BEST PARLAYS</h1><p>Parlays are built after singles. HR slips stay separate as risky lottery builds.</p></div>`+parlayPage()+hrPage()}
function openRecord(){document.getElementById('home').style.display='none';document.getElementById('app').classList.add('active');window.currentSport='golf';setAccent('golf');setTabs(['Record','Parlays'],'Record');content.innerHTML=`<div class="hero"><h1>ONYX RECORD</h1><p>June 24 active props are pending and ready to grade after completion.</p></div>`+recordPage()}
function golfCoursePage(){return coursePage()} function renderHistory(){return recordPage()} function renderRecord(){return recordPage()} function renderParlays(){return parlayPage()} function openParlay(){return openParlays()} function openHrPanel(){return hrPage()} function closeHrPanel(){} function switchGame(){}
</script></body></html>
